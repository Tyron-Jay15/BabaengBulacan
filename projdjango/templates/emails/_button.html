<table role="presentation" class="bb-btn" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
    <tr>
        <td align="center" bgcolor="#7B2CBF" style="border-radius:10px; background-color:#7B2CBF;">
            <!-- Solid bgcolor — gradients are stripped by Gmail/Outlook and hide white button text -->
            <a href="{{ url }}" target="_blank"
               style="display:inline-block; padding:14px 30px; font-size:15px; font-weight:700; color:#ffffff !important; text-decoration:none; border-radius:10px;">
                <span style="color:#ffffff !important;">{{ label }}</span>
            </a>
        </td>
    </tr>
</table>
