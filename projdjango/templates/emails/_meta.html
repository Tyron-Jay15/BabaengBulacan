<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:18px 0; background-color:#f7f4fc; border-radius:10px;">
    <tr>
        <td style="padding:16px 20px; font-size:13px; color:#5a5470; line-height:1.7;">
            <strong style="color:#3d3457;">Sign-in details</strong><br>
            <span style="color:#8a82a3;">Time:</span> {{ when|date:"M j, Y, g:i a" }} (UTC)<br>
            <span style="color:#8a82a3;">IP address:</span> {{ ip_address }}<br>
            <span style="color:#8a82a3;">Device:</span> {{ device }}<br>
            <span style="color:#8a82a3;">Browser:</span> {{ browser }}<br>
            <span style="color:#8a82a3;">Operating system:</span> {{ os }}
        </td>
    </tr>
</table>
